# Shopify app configuration. `shopify app config push` syncs this.
client_id = ""
name = "NDR Auditor"
handle = "ndr-auditor"
application_url = "https://example.com"
embedded = true

[access_scopes]
# read_all_orders is deliberately NOT here: it requires Shopify approval and the app must
# work honestly on a 60-day window without it. Add it once approved, then widen the audit.
scopes = "read_orders,read_fulfillments,write_fulfillments"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "fulfillments/create", "fulfillments/update" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/cancelled", "refunds/create" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

  # Mandatory compliance webhooks.
  [[webhooks.subscriptions]]
  topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

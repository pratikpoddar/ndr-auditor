# Fly.io deployment for NDR Auditor.
#
# Two processes from one image:
#   web    - the embedded Remix app and the webhook endpoint
#   worker - drains the Postgres-backed job queue (backfill, inference, alerts)
#
# The web machine must NOT scale to zero. Shopify times webhooks out at a few seconds, and a
# cold start would blow that budget on every quiet period. The worker may stop when idle
# because jobs are durable in Postgres, but it is cheap enough to leave running and that keeps
# NDR detection inside the spec's two-minute target.

app = "ndr-auditor"
primary_region = "sin"   # Singapore: closest Fly region to India (~50-80ms). Fly no longer
                         # offers Mumbai (bom). Revisit if they bring it back.

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "sh -c 'npx prisma migrate deploy && npm run start'"
  worker = "npm run worker"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  ALERT_PROVIDER = "console"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

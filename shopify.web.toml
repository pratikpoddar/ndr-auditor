# Tells the Shopify CLI how to run this app's web process during `shopify app dev`.
# The CLI injects SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOPIFY_APP_URL and SCOPES into this
# process, so those must NOT be set to placeholder values in .env or they will shadow the
# real ones.
name = "ndr-auditor"
roles = ["frontend", "backend"]

[commands]
dev = "npm run dev:remix"
